name: formal-methods

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  waiter-lifecycle:
    name: fmctl + Quint waiter lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NO_COLOR: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact reviewed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out pinned fmctl incubator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: opto-sync/opto-sync-clients
          ref: c2146ef9f054d24e1488c216547852aa148285cf
          path: .formal-tools/opto-sync-clients
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify fmctl source and exact Rust authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .formal-tools/opto-sync-clients rev-parse HEAD)" = "c2146ef9f054d24e1488c216547852aa148285cf"
          manifest_rust="$(sed -n 's/^rust = "\([^"]*\)"/\1/p' formal/fm.toml)"
          fmctl_rust="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' .formal-tools/opto-sync-clients/tools/fmctl/rust-toolchain.toml)"
          [[ "$manifest_rust" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$fmctl_rust" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$manifest_rust" = "$fmctl_rust"
          rustup toolchain install "$fmctl_rust" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$fmctl_rust"
          test "$(rustc --version | awk '{print $2}')" = "$fmctl_rust"

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Java 17 for TLC
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build pinned fmctl runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fmctl-source"
          cp -R .formal-tools/opto-sync-clients/tools/fmctl/. "$RUNNER_TEMP/fmctl-source/"
          cargo build --locked --release --manifest-path "$RUNNER_TEMP/fmctl-source/Cargo.toml"
          fmctl="$RUNNER_TEMP/fmctl-source/target/release/fmctl"
          test -x "$fmctl"
          echo "FMCTL=$fmctl" >> "$GITHUB_ENV"

      - name: Validate concrete refinement corpus
        run: >-
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020
          -s protocol/formal-waiter-lifecycle.schema.json
          -d protocol/formal-waiter-lifecycle.json

      - name: Validate repository formal-methods manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .formal-artifacts/fmctl
          "$FMCTL" --format json validate | tee .formal-artifacts/fmctl/validate.json

      - name: Record and validate formal toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$FMCTL" --format json doctor | tee .formal-artifacts/fmctl/doctor.json

      - name: Type-check declared waiter lifecycle model
        run: "$FMCTL" check

      - name: Reach every configured waiter lifecycle witness
        run: "$FMCTL" simulate

      - name: Exhaust declared finite waiter lifecycle state graph
        run: "$FMCTL" verify

      - name: Upload model-checker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zed-lock-formal-methods-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .formal-artifacts/
            formal/fm.toml
            formal/waiter_lifecycle.qnt
            protocol/formal-waiter-lifecycle.schema.json
            protocol/formal-waiter-lifecycle.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
