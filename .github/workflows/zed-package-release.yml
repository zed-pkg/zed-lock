name: Immutable Zed package release

on:
  pull_request:
    paths:
      - .github/workflows/zed-package-release.yml
      - .zpkg.toml
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
  push:
    branches: [main]
    paths:
      - .github/workflows/zed-package-release.yml
      - .zpkg.toml
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-lock-package-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REF: v0.1.2
  VERSION: 0.1.2
  ZED_CLI_COMMIT: eb5656e974105677982f533c6ae24f2c99abdf2e
  ZED_PKG_INTERACTIVE: 'false'

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      source_commit: ${{ steps.provenance.outputs.source_commit }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: package
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release source
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_REF"; then
            release_source="$(git rev-list -n1 "$RELEASE_REF")"
            echo "release source: existing immutable $RELEASE_REF -> $release_source"
          else
            release_source="$candidate"
            echo "release source: exact candidate $release_source (tag not cut yet)"
          fi
          if [ "$candidate" != "$release_source" ]; then
            git checkout --detach "$release_source"
          fi
          test "$(git rev-parse HEAD)" = "$release_source"

      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Verify synchronized release metadata
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk -F '"' '/^version = / { print $2; exit }' .zpkg.toml)" = "$VERSION"
          test "$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)" = "$VERSION"
          grep -A1 -F 'name = "zed-lock"' Cargo.lock | grep -Fx "version = \"$VERSION\"" >/dev/null
          cargo fmt --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Record exact source provenance
        id: provenance
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_REF"; then
            test "$(git rev-list -n1 "$RELEASE_REF")" = "$source_commit"
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Check out exact fixed Zed CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: zed-cli
          persist-credentials: false

      - name: Build pinned Zed CLI
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZED_CLI_COMMIT"
          cargo build --locked --bin zed
          mkdir -p "$RUNNER_TEMP/zed-bin"
          install -m 0755 target/debug/zed "$RUNNER_TEMP/zed-bin/zed"
          echo "$RUNNER_TEMP/zed-bin" >> "$GITHUB_PATH"

      - name: Prove canonical package bytes
        id: pack
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_REF"; then
            test "$(git rev-list -n1 "$RELEASE_REF")" = "$source_commit"
          else
            # Pull requests can certify a future immutable tag locally without
            # mutating the remote repository.
            git tag "$RELEASE_REF" "$source_commit"
          fi
          output="$(zed publish --dry-run 2>&1)"
          printf '%s\n' "$output"
          canonical_line="$(printf '%s\n' "$output" | grep -F "dry run: would publish zed-pkg/zed-lock@${VERSION} " | head -n1)"
          test -n "$canonical_line"
          sha256="$(printf '%s\n' "$canonical_line" | sed -n 's/.*sha256 \([0-9a-f]\{64\}\)).*/\1/p')"
          test "${#sha256}" -eq 64
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

  publish:
    needs: certify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ZED_PKG_GITHUB_TOKEN: ${{ github.token }}
      ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
      EXPECTED_SHA256: ${{ needs.certify.outputs.sha256 }}
      SOURCE_COMMIT: ${{ needs.certify.outputs.source_commit }}
    steps:
      - name: Check out exact certified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: package
          fetch-depth: 0
          persist-credentials: true

      - name: Check out exact fixed Zed CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: zed-cli
          persist-credentials: false

      - name: Build pinned Zed CLI
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZED_CLI_COMMIT"
          cargo build --locked --bin zed
          mkdir -p "$RUNNER_TEMP/zed-bin"
          install -m 0755 target/debug/zed "$RUNNER_TEMP/zed-bin/zed"
          echo "$RUNNER_TEMP/zed-bin" >> "$GITHUB_PATH"

      - name: Create immutable patch tag if absent
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$RELEASE_REF"; then
            test "$(git rev-list -n1 "$RELEASE_REF")" = "$SOURCE_COMMIT"
          else
            git tag "$RELEASE_REF" "$SOURCE_COMMIT"
            git push origin "refs/tags/$RELEASE_REF"
          fi

      - name: Re-prove exact package bytes
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          output="$(zed publish --dry-run 2>&1)"
          printf '%s\n' "$output" | grep -F "dry run: would publish zed-pkg/zed-lock@${VERSION} " | grep -F "sha256 ${EXPECTED_SHA256})" >/dev/null

      - name: Restore pristine certified source after dry run
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          # A dry run may create publication scratch files, but it must never
          # mutate tracked source. Fail closed before removing only untracked
          # and ignored residue so the real publish uses the certified tree.
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          git clean -ffdx
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-list -n1 "$RELEASE_REF")" = "$SOURCE_COMMIT"

      - name: Publish canonical Zed package
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          zed publish

      - name: Verify GitHub Release fallback assets
        shell: bash
        run: |
          set -euo pipefail
          asset="zpkg-${EXPECTED_SHA256}.tar.gz"
          sidecar="zpkg-version.json"
          mkdir -p "$RUNNER_TEMP/release-verify"
          gh release download "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --pattern "$sidecar" --dir "$RUNNER_TEMP/release-verify"
          test "$(sha256sum "$RUNNER_TEMP/release-verify/$asset" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(jq -r '.schema' "$RUNNER_TEMP/release-verify/$sidecar")" = "zpkg.signed-version/v1"
          test "$(jq -r '.payload.sha256' "$RUNNER_TEMP/release-verify/$sidecar")" = "$EXPECTED_SHA256"
          test "$(jq -r '.payload.vcs_tag' "$RUNNER_TEMP/release-verify/$sidecar")" = "$RELEASE_REF"
          test "$(jq -r '.payload.vcs_commit' "$RUNNER_TEMP/release-verify/$sidecar")" = "$SOURCE_COMMIT"

      - name: Outside-in registry-down fallback canary
        shell: bash
        env:
          ZED_PKG_REGISTRY: http://127.0.0.1:9
          ZED_PKG_SOURCE_FALLBACK_ALLOW_LOOPBACK: 'true'
          ZED_PKG_SOURCE_FALLBACK: 'true'
          ZED_PKG_TOKEN: ''
        run: |
          set -euo pipefail
          canary="$RUNNER_TEMP/zed-lock-release-canary"
          mkdir -p "$canary"
          cat > "$canary/.zpkg.toml" <<EOF
          [package]
          org = "zed-lock-release-canary"
          name = "consumer"
          version = "0.0.0"
          license = "MIT"

          [package.repository]
          vcs = "git"
          url = "https://github.com/zed-pkg/zed-lock"

          [dependencies]
          "zed-pkg/zed-lock" = "=${VERSION}"
          EOF
          cd "$canary"
          zed install
          test -s .zpkg.lock
          grep -F "$EXPECTED_SHA256" .zpkg.lock >/dev/null
