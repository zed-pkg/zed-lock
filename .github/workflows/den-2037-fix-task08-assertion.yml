name: DEN-2037 repair sixth-order task08 assertion

on:
  push:
    branches: [den-2037-sixth-order-api-events]
    paths: ['.github/workflows/den-2037-fix-task08-assertion.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-sixth-order-api-events
          fetch-depth: 0
          persist-credentials: true
      - name: Replace Debug-requiring expect_err without changing semantics
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("tests/den_2037_sixth_order.rs"); s=p.read_text(); old="    let error = manager\n        .acquire_timeout(\n            LockRequest::exclusive(&path)\n                .operation(\"task08-timeout\")\n                .queue_same_process(),\n            Duration::ZERO,\n        )\n        .expect_err(\"zero deadline must time out while contended\");\n"; new="    let error = match manager.acquire_timeout(\n        LockRequest::exclusive(&path)\n            .operation(\"task08-timeout\")\n            .queue_same_process(),\n        Duration::ZERO,\n    ) {\n        Ok(_) => panic!(\"zero deadline must time out while contended\"),\n        Err(error) => error,\n    };\n"; assert s.count(old)==1, "task08 anchor"; p.write_text(s.replace(old,new,1))'
          rustfmt --edition 2024 tests/den_2037_sixth_order.rs
          git diff --check
      - name: Commit repair
        run: |
          set -euo pipefail
          git add tests/den_2037_sixth_order.rs
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'test(DEN-2037): avoid Debug bound in timeout assertion'
          git push origin HEAD:den-2037-sixth-order-api-events
