name: DEN-2037 repair sixth-order task08 assertion

on:
  push:
    branches: [den-2037-sixth-order-api-events]
    paths: ['.github/workflows/den-2037-fix-task08-assertion.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-sixth-order-api-events
          fetch-depth: 0
          persist-credentials: true
      - name: Replace Debug-requiring expect_err without changing semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/den_2037_sixth_order.rs')
          text=path.read_text()
          old='''    let error = manager
        .acquire_timeout(
            LockRequest::exclusive(&path)
                .operation("task08-timeout")
                .queue_same_process(),
            Duration::ZERO,
        )
        .expect_err("zero deadline must time out while contended");
'''
          new='''    let error = match manager.acquire_timeout(
        LockRequest::exclusive(&path)
            .operation("task08-timeout")
            .queue_same_process(),
        Duration::ZERO,
    ) {
        Ok(_) => panic!("zero deadline must time out while contended"),
        Err(error) => error,
    };
'''
          if text.count(old) != 1:
              raise SystemExit('task08 assertion anchor not found exactly once')
          path.write_text(text.replace(old,new,1))
          PY
          rustfmt --edition 2024 tests/den_2037_sixth_order.rs
          git diff --check
      - name: Commit repair
        run: |
          set -euo pipefail
          git add tests/den_2037_sixth_order.rs
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'test(DEN-2037): avoid Debug bound in timeout assertion'
          git push origin HEAD:den-2037-sixth-order-api-events
