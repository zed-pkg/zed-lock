name: DEN-2037 format sixth-order suite

on:
  push:
    branches: [den-2037-sixth-order-api-events]
    paths: ['.github/workflows/den-2037-format-sixth-order.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-sixth-order-api-events
          fetch-depth: 0
          persist-credentials: true
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - run: rustfmt +1.88.0 --edition 2024 tests/den_2037_sixth_order.rs
      - name: Commit only the formatted suite
        run: |
          set -euo pipefail
          git add tests/den_2037_sixth_order.rs
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          if git diff --cached --quiet; then
            echo 'already formatted'
            exit 0
          fi
          git commit -m 'style(DEN-2037): format sixth-order conformance suite'
          git push origin HEAD:den-2037-sixth-order-api-events
