name: zed-lock CI and package artifact

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-lock-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} conformance
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Validate Cargo, Zed package, and provenance contracts
        run: python3 scripts/check-package-contract.py

      - name: Exercise package-contract negative cases
        run: python3 -m unittest -v tests/test_package_contract.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all Rust tests
        run: cargo test --locked --all-targets -- --nocapture

      - name: Prove local lock acquisition performs zero network syscalls
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi

          # Compile before tracing so Cargo's registry/network behavior is not
          # confused with zed-lock's production runtime behavior.
          cargo build --locked --example basic
          trace="$RUNNER_TEMP/zed-lock-network.trace"
          : > "$trace"
          strace -f -qq -e trace=network -o "$trace" target/debug/examples/basic

          if test -s "$trace"; then
            echo "zed-lock local acquisition unexpectedly performed network syscalls:" >&2
            cat "$trace" >&2
            exit 1
          fi

      - name: Deny Clippy warnings
        run: cargo clippy --locked --all-targets -- -D warnings

  package:
    name: Build reviewable crate artifact
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - name: Build and verify the exact crate package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-package-contract.py
          cargo package --locked
          mkdir -p dist
          cp target/package/zed-lock-0.1.1.crate dist/
          sha256sum dist/zed-lock-0.1.1.crate > dist/zed-lock-0.1.1.crate.sha256
          test -s dist/zed-lock-0.1.1.crate
          test -s dist/zed-lock-0.1.1.crate.sha256

      - name: Upload the review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-lock-0.1.1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
