name: zed-lock CI and package artifact

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-lock-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} conformance
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Validate Cargo, Zed package, and provenance contracts
        run: python3 scripts/check-package-contract.py

      - name: Exercise package-contract negative cases
        run: python3 -m unittest -v tests/test_package_contract.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all Rust tests
        run: cargo test --locked --all-targets -- --nocapture

      - name: Prove local lock acquisition performs zero network syscalls
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi

          cargo build --locked --example basic
          trace="$RUNNER_TEMP/zed-lock-network.trace"
          : > "$trace"
          strace -f -qq -e trace=network -o "$trace" target/debug/examples/basic

          if test -s "$trace"; then
            echo "zed-lock local acquisition unexpectedly performed network syscalls:" >&2
            cat "$trace" >&2
            exit 1
          fi

      - name: Deny Clippy warnings
        run: cargo clippy --locked --all-targets -- -D warnings

  formal-model:
    name: pinned fmctl finite-model certification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NO_COLOR: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact reviewed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out pinned fmctl incubator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: opto-sync/opto-sync-clients
          ref: c2146ef9f054d24e1488c216547852aa148285cf
          path: .formal-tools/opto-sync-clients
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify fmctl source and exact Rust authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .formal-tools/opto-sync-clients rev-parse HEAD)" = "c2146ef9f054d24e1488c216547852aa148285cf"
          manifest_rust="$(sed -n 's/^rust = "\([^"]*\)"/\1/p' formal/fm.toml)"
          fmctl_rust="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' .formal-tools/opto-sync-clients/tools/fmctl/rust-toolchain.toml)"
          [[ "$manifest_rust" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$fmctl_rust" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$manifest_rust" = "$fmctl_rust"
          rustup toolchain install "$fmctl_rust" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$fmctl_rust"
          test "$(rustc --version | awk '{print $2}')" = "$fmctl_rust"

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Java 17 for TLC
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build pinned fmctl runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fmctl-source"
          cp -R .formal-tools/opto-sync-clients/tools/fmctl/. "$RUNNER_TEMP/fmctl-source/"
          cargo build --locked --release --manifest-path "$RUNNER_TEMP/fmctl-source/Cargo.toml"
          fmctl="$RUNNER_TEMP/fmctl-source/target/release/fmctl"
          test -x "$fmctl"
          echo "FMCTL=$fmctl" >> "$GITHUB_ENV"

      - name: Validate concrete refinement corpus
        run: >-
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020
          -s protocol/formal-waiter-lifecycle.schema.json
          -d protocol/formal-waiter-lifecycle.json

      - name: Validate and inspect formal manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .formal-artifacts/fmctl
          "$FMCTL" --format json validate | tee .formal-artifacts/fmctl/validate.json
          "$FMCTL" --format json doctor | tee .formal-artifacts/fmctl/doctor.json

      - name: Run manifest-owned formal proof stages
        shell: bash
        run: |
          set -euo pipefail
          "$FMCTL" check
          "$FMCTL" simulate
          "$FMCTL" verify

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zed-lock-formal-methods-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .formal-artifacts/
            formal/fm.toml
            formal/waiter_lifecycle.qnt
            protocol/formal-waiter-lifecycle.schema.json
            protocol/formal-waiter-lifecycle.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build reviewable crate artifact
    needs: [test, formal-model]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - name: Build and verify the exact crate package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-package-contract.py
          cargo package --locked
          mkdir -p dist
          cp target/package/zed-lock-0.1.1.crate dist/
          sha256sum dist/zed-lock-0.1.1.crate > dist/zed-lock-0.1.1.crate.sha256
          test -s dist/zed-lock-0.1.1.crate
          test -s dist/zed-lock-0.1.1.crate.sha256

      - name: Upload the review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-lock-0.1.1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
